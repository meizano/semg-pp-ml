[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semg-pp-ml"
version = "0.2.0"
description = "Surface EMG preprocessing and machine learning platform for NinaPro DB8"
readme = "README.md"
requires-python = ">=3.10"
# Core: enough for preprocessing, classical models, grid search, CLI and augmentation.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "psutil>=5.9",
    "joblib>=1.3",
    "vmdpy>=0.2",
    "PyWavelets>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Deep learning models (CNN, LSTM, Transformer, TCN, GNN, TinyML export)
dl = [
    "torch>=2.0",
]
# Streamlit web app
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pillow>=10.0",
]
# MLflow experiment tracking
tracking = [
    "mlflow>=2.10",
]
# Optional FastAPI backend (api/ package): auth, DB, background workers
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "celery>=5.3",
    "python-jose>=3.3",
    "passlib>=1.7",
    "email-validator>=2.0",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.0",
]
all = ["semg-pp-ml[dl,ui,tracking,api,dev]"]

[project.scripts]
semg = "semg_pp_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP007"]

[tool.black]
line-length = 100
target-version = ["py310"]
